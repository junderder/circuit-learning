<main id="main">

    <div class="page-head">
      <span class="eyebrow">课程目录</span>
      <h1>17 章，一条完整的知识主线</h1>
      <p class="lead">建议按顺序学：后面的分析方法和定理，全部建立在前面的变量、定律与等效之上。每章末尾都有“核心公式—典型例题—易错点”三段式总结。</p>
    </div>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-mod="all" type="button">全部（17）</button>

    <div class="card mt-3" style="background:var(--surface-2)">
      <h3>学习建议</h3>
      <div class="grid cols-2 mt-1">
        <div>
          <p class="small"><b>第一轮（理解）</b>：读正文，重点看公式的适用条件与例题的解题步骤，不必强记。</p>
          <p class="small mb-0"><b>第二轮（练习）</b>：每章做 5～7 道题，错题自动进入错题本。</p>
        </div>
        <div>
          <p class="small"><b>第三轮（串联）</b>：学完第 9 章后回头把 1—9 章串成一张图；学完第 13 章后把正弦稳态部分串起来。</p>
          <p class="small mb-0"><b>考前</b>：只看“核心公式”和“易错点”，再刷一遍错题本。</p>
        </div>
      </div>
    </div>
  </div>
